server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: appointment-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 5.7 / 8.x 通用；库不存在时请先执行 sql/schema.sql
    # 本机 Docker MySQL 容器（mysql-doctor）映射端口为 3310；自建 MySQL 请改回 3306
    url: jdbc:mysql://localhost:3310/private_doctor_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置（生产环境请改为更复杂的密钥）
jwt:
  secret: private-doctor-appointment-platform-jwt-secret-key-2026
  # 过期时间（小时）
  expire-hours: 12

# Knife4j 接口文档：http://localhost:8080/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true
